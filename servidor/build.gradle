// Servidor Spring Boot do JavaQuest: entrega as lições, compila e roda o código dos alunos.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-parameters' }

def sandboxLibs = project(':motor').layout.buildDirectory.dir('sandbox-libs')

// Se o site (frontend) já foi construído, ele vai junto dentro do servidor.
processResources {
    from(rootProject.file('frontend/dist')) { into 'static' }
}

bootRun {
    dependsOn ':motor:sandboxLibs'
    systemProperty 'javaquest.sandbox.libs', sandboxLibs.get().asFile.absolutePath
}

test {
    useJUnitPlatform()
    dependsOn ':motor:sandboxLibs'
    systemProperty 'javaquest.sandbox.libs', sandboxLibs.get().asFile.absolutePath
    testLogging { events 'failed'; exceptionFormat 'full' }
}

bootJar { archiveFileName = 'servidor.jar' }
jar { enabled = false }
