spring.application.name=javaquest
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
spring.jackson.default-property-inclusion=non_null

# Pasta com o motor do jogo e as bibliotecas que o código dos alunos pode usar.
javaquest.sandbox.libs=sandbox-libs
# Quanto tempo um programa pode rodar antes de ser parado.
javaquest.tempo-limite-ms=6000
# Quantos programas podem rodar ao mesmo tempo.
javaquest.max-simultaneos=4
