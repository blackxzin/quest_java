licoes:

  - id: objetos
    titulo: Muitos robôs!
    modo: completo
    historia: |
      Bem-vindo à **Fábrica de Robôs**! 🏭 Hoje o Byte vai ganhar companhia:
      a **Bia** e o **Leo** precisam chegar cada um na sua bandeira.
    explicacao: |
      Lembra do `new Robo()`? Agora vamos entender!

      Uma **classe** é como uma **fôrma de biscoito**. 🍪 A classe `Robo` diz como todo robô é:
      ele anda, vira, pega moedas, fala...

      Cada vez que você escreve `new Robo()`, a fábrica usa a fôrma para fazer um robô **novinho**.
      Cada robô criado é um **objeto**.

      ```java
      Robo bia = new Robo("Bia", "rosa");
      Robo leo = new Robo("Leo", "verde");

      bia.andar();   // só a Bia anda
      leo.falar("Oi!");  // só o Leo fala
      ```

      - Os dois saíram da mesma fôrma (a classe `Robo`), mas **cada um é um objeto diferente**,
        com seu próprio lugar no mapa e suas próprias moedas.
      - O que vai entre os parênteses (`"Bia", "rosa"`) é entregue para o **construtor**, que monta o robô.
      - Cores: azul, vermelho, verde, amarelo, roxo, rosa e laranja.
    dica: |
      Crie o Leo com `Robo leo = new Robo("Leo", "verde");` e, dentro do for, faça `leo.andar();` também.
    codigoInicial: |
      import jogo.*;

      public class Missao {
          public static void main(String[] args) {
              Robo bia = new Robo("Bia", "rosa");
              // Crie o Leo aqui!

              for (int i = 0; i < 4; i++) {
                  bia.andar();
              }
          }
      }
    solucao: |
      import jogo.*;

      public class Missao {
          public static void main(String[] args) {
              Robo bia = new Robo("Bia", "rosa");
              Robo leo = new Robo("Leo", "verde");

              for (int i = 0; i < 4; i++) {
                  bia.andar();
                  leo.andar();
              }
          }
      }
    mapa:
      - "#######"
      - "#R...F#"
      - "#######"
      - "#R...F#"
      - "#######"
    objetivos:
      - tipo: robos
        quantidade: 2
      - tipo: chegar

  - id: robo-esperto
    titulo: O Robô Esperto
    modo: completo
    historia: |
      Os engenheiros da fábrica querem um modelo novo: o **RoboEsperto**! 🧠
      Ele sabe tudo o que um robô normal sabe, e mais alguns truques.
    explicacao: |
      Dá para criar uma classe nova **a partir** de outra. Isso se chama **herança**:

      ```java
      class RoboEsperto extends Robo {
          RoboEsperto(String nome) {
              super(nome);
          }

          void virarAtras() {
              virarDireita();
              virarDireita();
          }
      }
      ```

      - `extends Robo` → "o RoboEsperto **é um** Robo". Ele **herda** tudo: andar, virar, falar...
      - `super(nome)` → chama o construtor do "pai" (o Robo) para montar a parte de robô
      - Dentro da classe, dá para chamar `virarDireita()` direto: é o próprio robô fazendo!

      Repare: o RoboEsperto tem **dois** `andar`: o normal `andar()` e o novo `andar(int passos)`.
      O Java sabe qual usar pelo que vai entre os parênteses!
    dica: |
      No método virarAtras, gire duas vezes: `virarDireita(); virarDireita();`
    codigoInicial: |
      import jogo.*;

      class RoboEsperto extends Robo {
          RoboEsperto(String nome) {
              super(nome);
          }

          void andar(int passos) {
              for (int i = 0; i < passos; i++) {
                  andar();
              }
          }

          void virarAtras() {
              // Ensine o robô a dar meia-volta!
          }
      }

      public class Missao {
          public static void main(String[] args) {
              RoboEsperto esperto = new RoboEsperto("Byte");
              esperto.andar(4);
              esperto.pegarMoeda();
              esperto.virarAtras();
              esperto.andar(5);
          }
      }
    solucao: |
      import jogo.*;

      class RoboEsperto extends Robo {
          RoboEsperto(String nome) {
              super(nome);
          }

          void andar(int passos) {
              for (int i = 0; i < passos; i++) {
                  andar();
              }
          }

          void virarAtras() {
              virarDireita();
              virarDireita();
          }
      }

      public class Missao {
          public static void main(String[] args) {
              RoboEsperto esperto = new RoboEsperto("Byte");
              esperto.andar(4);
              esperto.pegarMoeda();
              esperto.virarAtras();
              esperto.andar(5);
          }
      }
    mapa:
      - "########"
      - "#FR...M#"
      - "########"
    objetivos:
      - tipo: moedas
      - tipo: chegar
    requisitos:
      - padrao: 'extends\s+Robo'
        mensagem: Use a classe RoboEsperto, que estende (extends) o Robo.

  - id: atributos
    titulo: A memória do robô
    modo: completo
    historia: |
      O **RoboContador** conta cada passo que dá, e no final diz quantos foram. 👣
      Cada mundo tem um corredor de tamanho diferente!
    explicacao: |
      Uma classe pode ter **atributos**: caixinhas que **o objeto** guarda dentro dele.

      ```java
      class RoboContador extends Robo {
          private int passos = 0;

          void andarContando() {
              andar();
              passos++;
          }

          int getPassos() {
              return passos;
          }
      }
      ```

      - `passos` é um atributo: cada RoboContador tem o **seu próprio** contador.
      - `private` → só a própria classe pode mexer. É como um **diário com cadeado** 🔒.
        Ninguém de fora consegue bagunçar a conta!
      - `getPassos()` → um método para os outros **lerem** o valor (mas não mudarem).
        Isso se chama **encapsulamento**.
    dica: |
      No método andarContando, depois do `andar();`, some 1 no atributo: `passos++;`
    codigoInicial: |
      import jogo.*;

      class RoboContador extends Robo {
          private int passos = 0;

          void andarContando() {
              andar();
              // e conte o passo!
          }

          int getPassos() {
              return passos;
          }
      }

      public class Missao {
          public static void main(String[] args) {
              RoboContador robo = new RoboContador();
              while (!robo.chegou()) {
                  robo.andarContando();
              }
              robo.falar("Andei " + robo.getPassos() + " passos!");
          }
      }
    solucao: |
      import jogo.*;

      class RoboContador extends Robo {
          private int passos = 0;

          void andarContando() {
              andar();
              passos++;
          }

          int getPassos() {
              return passos;
          }
      }

      public class Missao {
          public static void main(String[] args) {
              RoboContador robo = new RoboContador();
              while (!robo.chegou()) {
                  robo.andarContando();
              }
              robo.falar("Andei " + robo.getPassos() + " passos!");
          }
      }
    mundos:
